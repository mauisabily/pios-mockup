<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIOS - Business Owner Login | BizGrowth Engine</title>
    <meta name="description" content="RUN Your PIOS Business. Build your customer database and manage your product listing from your own panel.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Responsive Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- Mobile Top Navigation Header (Shown on Mobile screens) -->
    <header class="mobile-header" id="mobileHeader">
        <div class="mobile-header-inner">
            <a href="./index.html" class="mobile-logo-link" aria-label="PIOS Homepage">
                <img src="./assets/images/header_logo.png" alt="PIOS BizGrowth Engine" class="mobile-header-logo">
            </a>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="mobileDrawer">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
        </div>
    </header>

    <!-- Mobile Fullscreen Menu (Figma 3.0_nav_dashboard design) -->
    <div class="drawer-overlay" id="drawerOverlay" aria-hidden="true"></div>
    <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
        <div class="drawer-header">
            <div class="drawer-logo-container">
                <a href="./index.html">
                    <img src="./assets/images/header_logo.png" alt="PIOS" class="drawer-header-logo">
                </a>
            </div>
            <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close Navigation Menu">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <nav class="drawer-nav">
            <a href="./dashboard.html" class="drawer-item">
                <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span>Dashboard</span>
            </a>
            <div class="drawer-group">
                <a href="./customer.html" class="drawer-item">
                    <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Customer</span>
                </a>
                <a href="./customer.html#register-customer" class="drawer-subitem">
                    <svg class="drawer-icon-sub" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    <span>Register Customer</span>
                </a>
            </div>
            <a href="./products.html" class="drawer-item">
                <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span>Products</span>
            </a>
            <a href="./transaction.html" class="drawer-item">
                <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <span>Transaction</span>
            </a>
            <a href="./fees.html" class="drawer-item">
                <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                <span>Fees</span>
            </a>
            <a href="./reports.html" class="drawer-item">
                <svg class="drawer-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Reports</span>
            </a>
        </nav>

        <div class="drawer-footer">
            <div class="dark-mode-row">
                <div class="dark-mode-label">
                    <svg class="fs-icon-moon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="fs-icon-sun sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span>Dark mode</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="drawer-user">
                <img src="./assets/images/lenny_avatar.png" alt="Lenny Muller" class="user-avatar-img" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                <div class="user-info" style="margin-left: 12px; flex: 1;">
                    <span class="user-name" style="font-size: 1.05rem; font-weight: 600; color: #fff;">Lenny Muller</span>
                </div>
                <a href="./login.html" class="logout-btn" aria-label="Sign out" style="color: rgba(255,255,255,0.7); display: flex; align-items: center;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </div>
        </div>
    </aside>

    <!-- Main Container (Desktop 2-column & Mobile 1-column layout) -->
    <main class="login-wrapper">
        <div class="login-container">
            
            <!-- Left Side: Hero Card (Visible on Desktop) -->
            <section class="login-hero-card" aria-label="PIOS Business Overview">
                <img src="./assets/images/hero_card.png" alt="RUN Your PIOS Business" class="hero-image">
            </section>

            <!-- Right Side: Login Form (Adaptive for Desktop & Mobile) -->
            <section class="login-form-card" aria-label="PIOS Login Form">
                
                <!-- Center Mascot Logo (Switches asset based on theme/breakpoint) -->
                <div class="brand-logo-wrapper">
                    <!-- Desktop Logo (Dark Navy background) -->
                    <img src="./assets/images/desktop_center_logo.png" alt="PIOS BizGrowth Engine" class="center-logo desktop-only">
                    <!-- Mobile Logo (Teal background) -->
                    <img src="./assets/images/center_logo.png" alt="PIOS BizGrowth Engine" class="center-logo mobile-only">
                </div>

                <!-- Interactive Login Form -->
                <form class="login-form" id="loginForm" autocomplete="on" novalidate>
                    
                    <!-- PIOS ID Input Group -->
                    <div class="form-group">
                        <label for="piosId" class="form-label">
                            PIOS ID<span class="required-mark">*</span>
                        </label>
                        <div class="input-container">
                            <input 
                                type="text" 
                                id="piosId" 
                                name="piosId" 
                                class="form-input" 
                                placeholder="Enter your ID" 
                                required 
                                autocomplete="username"
                                aria-required="true"
                            >
                        </div>
                        <div class="field-error" id="piosIdError">Please enter your PIOS ID</div>
                    </div>

                    <!-- Password Input Group -->
                    <div class="form-group">
                        <div class="password-label-row">
                            <label for="password" class="form-label">
                                Password<span class="required-mark">*</span>
                            </label>
                            <a href="#forgot-password" class="forgot-password-link">Forgot password?</a>
                        </div>
                        <div class="input-container password-container">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="••••••••••••" 
                                required 
                                autocomplete="current-password"
                                aria-required="true"
                            >
                            <button 
                                type="button" 
                                class="password-toggle-btn" 
                                id="passwordToggleBtn" 
                                aria-label="Toggle password visibility"
                                tabindex="0"
                            >
                                <!-- Eye Icon (Show) -->
                                <svg class="eye-icon eye-show" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <!-- Eye Off Icon (Hide) -->
                                <svg class="eye-icon eye-hide" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="field-error" id="passwordError">Please enter your password</div>
                    </div>

                    <!-- Remember Me Checkbox Group -->
                    <div class="checkbox-group">
                        <label class="custom-checkbox-container">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="custom-checkmark">
                                <svg class="check-icon" width="12" height="10" viewBox="0 0 12 10" fill="none">
                                    <path d="M1 5L4.5 8.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span class="checkbox-text">Remember me</span>
                        </label>
                    </div>

                    <!-- Login Submit Button -->
                    <button type="submit" class="submit-btn" id="loginSubmitBtn">
                        <span class="btn-text">Login</span>
                        <div class="btn-spinner" id="btnSpinner" aria-hidden="true"></div>
                    </button>

                    <!-- Feedback Alert Banner -->
                    <div class="login-feedback" id="loginFeedback" role="alert" aria-live="polite"></div>

                </form>
            </section>

        </div>
    </main>

    <!-- Main Javascript -->
    <script src="./assets/js/script.js"></script>
</body>
</html>
